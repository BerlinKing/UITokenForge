<!doctype html>
<html lang="zh-CN" data-locale="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light">
  <title>{{REGRESSION_TITLE}}</title>
  <style>
    :root{--ink:#111;--muted:#686864;--line:#deded9;--wash:#f6f6f3;--paper:#fff;--blue:#1f5eff;--red:#d92d20;--green:#16803c;--page:min(1540px,calc(100vw - 48px))}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}.top{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(255,255,255,.95);backdrop-filter:blur(14px)}.top-inner{width:var(--page);height:60px;margin:auto;display:flex;align-items:center;gap:12px}.brand{font-weight:760}.spacer{flex:1}.button{height:36px;padding:0 13px;border:1px solid #aaa;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#111;color:#fff;border-color:#111}.locale{display:flex;padding:3px;border:1px solid var(--line);border-radius:9px;background:var(--wash)}.locale button{border:0;border-radius:6px;background:none;height:28px;min-width:36px}.locale button.active{background:#fff;box-shadow:0 1px 3px #0002}.hero,.main{width:var(--page);margin:auto}.hero{padding:64px 0 38px;border-bottom:1px solid #111}.eyebrow{color:var(--blue);font-weight:760;font-size:12px;letter-spacing:.12em;text-transform:uppercase}.hero h1{margin:12px 0 18px;font-size:clamp(42px,6vw,78px);line-height:.98;letter-spacing:-.06em}.hero p{max-width:760px;color:var(--muted);font-size:17px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line)}.metric{padding:20px;border-left:1px solid var(--line)}.metric:first-child{border-left:0}.metric strong{display:block;font-size:26px}.metric span{font-size:12px;color:var(--muted)}section{padding:52px 0;border-bottom:1px solid var(--line)}h2{font-size:34px;letter-spacing:-.04em;margin:0 0 10px}.section-copy{color:var(--muted);margin:0 0 26px}.diff-summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:14px;overflow:hidden}.diff-block{padding:22px;border-left:1px solid var(--line)}.diff-block:first-child{border-left:0}.diff-block h3{margin:0 0 12px}.capture{border-top:3px solid #111;padding:24px 0 46px}.capture-head{display:flex;gap:20px;align-items:start;justify-content:space-between}.capture-head h3{font-size:24px;margin:0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{border:1px solid var(--line);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:12px}.frames{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}.frame{min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--wash)}.frame-label{padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700}.stage{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:auto;background:repeating-conic-gradient(#f0f0ed 0 25%,#fff 0 50%) 50%/18px 18px}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.difference img{position:absolute;inset:0;margin:auto}.difference img:last-child{mix-blend-mode:difference;opacity:.88}.missing{color:var(--muted);padding:24px;text-align:center}.decision{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.decision label{border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}.decision label:has(input:checked){border-color:#111;background:#111;color:#fff}.decision input{margin-right:7px}.evidence{margin-top:14px;color:var(--muted)}.coverage{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.coverage article{padding:16px;border:1px solid var(--line);border-radius:10px}.empty{padding:36px;border:1px dashed #aaa;border-radius:12px;color:var(--muted)}@media(max-width:900px){.metrics{grid-template-columns:repeat(3,1fr)}.frames,.diff-summary{grid-template-columns:1fr}.diff-block{border-left:0;border-top:1px solid var(--line)}.coverage{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){:root{--page:calc(100vw - 28px)}.top-inner{height:auto;min-height:60px;flex-wrap:wrap;padding:10px 0}.hero{padding-top:42px}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(odd){border-left:0}.capture-head{display:block}.frames{grid-template-columns:1fr}.coverage{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><div class="top-inner"><div class="brand">UITokenForge · Visual Regression</div><div class="spacer"></div><div class="locale"><button data-locale="zh">中</button><button data-locale="en">EN</button></div><button class="button primary" id="export"><span data-zh="导出复核结果" data-en="Export decisions"></span></button></div></header>
  <div class="hero"><div class="eyebrow">Before / After / Difference</div><h1><span data-zh="视觉回归复核" data-en="Visual regression review"></span></h1><p data-zh="在真实页面、功能与状态上比较治理前后截图。只有这里复核过的状态，才算运行时已验证。" data-en="Compare before and after screenshots across real pages, features, and states. Only reviewed captures count as runtime-verified."></p></div>
  <main class="main"><div class="metrics" id="metrics"></div><section><h2 data-zh="源码治理变化" data-en="Source governance changes"></h2><p class="section-copy" data-zh="先确认 Token 与直接样式值的清扫结果，再判断视觉变化是否符合预期。" data-en="Confirm token and direct-value cleanup before judging whether visual changes are intentional."></p><div class="diff-summary" id="source-diff"></div></section><section><h2 data-zh="页面状态对比" data-en="Page-state comparisons"></h2><p class="section-copy" data-zh="每张卡片都绑定功能、页面、状态、视口和主题。" data-en="Each card is bound to a feature, page, state, viewport, and theme."></p><div id="captures"></div></section><section><h2 data-zh="覆盖范围" data-en="Coverage"></h2><div class="coverage" id="coverage"></div></section></main>
  <script type="application/json" id="data">{{REGRESSION_JSON}}</script>
  <script>
  (()=>{const data=JSON.parse(document.getElementById("data").textContent);const state={locale:localStorage.getItem("govern-ui:locale")||((navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en"),decisions:{}};const e=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));const tr=(zh,en)=>state.locale==="zh"?zh:en;function apply(){document.documentElement.dataset.locale=state.locale;document.documentElement.lang=state.locale==="zh"?"zh-CN":"en";document.querySelectorAll("[data-zh]").forEach(n=>n.textContent=n.dataset[state.locale]);document.querySelectorAll("[data-locale]").forEach(n=>n.classList.toggle("active",n.dataset.locale===state.locale))}function render(){apply();const s=data.sourceDiff.summary,c=data.coverage;document.getElementById("metrics").innerHTML=[[c.total,tr("截图状态","captures")],[c.reviewable,tr("可复核","reviewable")],[c.unverified,tr("未验证","unverified")],[c.features.length,tr("功能","features")],[c.pages.length,tr("页面","pages")],[c.states.length,tr("状态","states")]].map(([v,l])=>`<div class="metric"><strong>${v}</strong><span>${e(l)}</span></div>`).join("");document.getElementById("source-diff").innerHTML=[[tr("Token","Tokens"),`${s.tokensBefore} → ${s.tokensAfter}`,tr(`${s.tokensRemoved} 删除 · ${s.tokensChanged} 修改 · ${s.tokensAdded} 新增`,`${s.tokensRemoved} removed · ${s.tokensChanged} changed · ${s.tokensAdded} added`)],[tr("直接样式值","Direct values"),`${s.directStylesBefore} → ${s.directStylesAfter}`,tr(`${s.directStylesRemoved} 清除 · ${s.directStylesRemaining} 残留 · ${s.directStylesAdded} 新增`,`${s.directStylesRemoved} cleared · ${s.directStylesRemaining} remaining · ${s.directStylesAdded} added`)],[tr("结论","Verdict"),s.directStylesAdded?tr("仍需处理","Needs work"):tr("等待视觉复核","Awaiting visual review"),tr("源码变化不等于视觉正确，必须逐状态确认。","Source changes do not prove visual correctness; verify each state.")]].map(x=>`<div class="diff-block"><h3>${e(x[0])}</h3><strong>${e(x[1])}</strong><p>${e(x[2])}</p></div>`).join("");document.getElementById("captures").innerHTML=data.captures.length?data.captures.map(item=>`<article class="capture"><div class="capture-head"><div><h3>${e(item.feature)} · ${e(item.page)}</h3><div class="tags">${[item.state,item.viewport,item.theme,...item.affectedTokens].map(x=>`<span class="tag">${e(x)}</span>`).join("")}</div></div><span class="tag">${e(item.status)}</span></div>${item.expectedChange?`<p class="evidence"><strong>${tr("预期变化","Expected change")}:</strong> ${e(item.expectedChange)}</p>`:""}<div class="frames">${[[tr("治理前","Before"),item.beforeImage,""],[tr("治理后","After"),item.afterImage,""],[tr("差异叠加","Difference"),item.beforeImage,"difference"]].map((x,i)=>`<div class="frame"><div class="frame-label">${e(x[0])}</div><div class="stage ${x[2]}">${x[1]?`<img src="${e(x[1])}" alt="">${i===2&&item.afterImage?`<img src="${e(item.afterImage)}" alt="">`:""}`:`<div class="missing">${tr("缺少截图，未验证","Missing screenshot — unverified")}</div>`}</div></div>`).join("")}</div><div class="decision">${[["accepted",tr("符合预期","Accept")],["intentional-change",tr("预期变化","Intentional change")],["repair",tr("需要修复","Repair")],["unverified",tr("暂未验证","Unverified")]].map(([v,l])=>`<label><input type="radio" name="${e(item.id)}" value="${v}" ${state.decisions[item.id]===v?"checked":""}>${e(l)}</label>`).join("")}</div>${item.limitation?`<p class="evidence">${e(item.limitation)}</p>`:""}</article>`).join(""):`<div class="empty">${tr("尚未提供页面状态清单与截图。","No page-state manifest or screenshots were provided.")}</div>`;document.getElementById("coverage").innerHTML=[[tr("功能","Features"),c.features],[tr("页面","Pages"),c.pages],[tr("状态","States"),c.states],[tr("视口","Viewports"),c.viewports],[tr("主题","Themes"),c.themes]].map(([l,v])=>`<article><strong>${e(l)}</strong><p>${e(v.join(", ")||"—")}</p></article>`).join("")}document.querySelector(".locale").addEventListener("click",ev=>{const b=ev.target.closest("[data-locale]");if(!b)return;state.locale=b.dataset.locale;localStorage.setItem("govern-ui:locale",state.locale);render()});document.getElementById("captures").addEventListener("change",ev=>{if(ev.target.type==="radio")state.decisions[ev.target.name]=ev.target.value});document.getElementById("export").addEventListener("click",()=>{const payload={schemaVersion:1,status:"draft",project:data.project,decisions:data.captures.map(x=>({captureId:x.id,decision:state.decisions[x.id]||"unverified",feature:x.feature,page:x.page,state:x.state,viewport:x.viewport,theme:x.theme,affectedTokens:x.affectedTokens}))};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="govern-ui-visual-decisions.json";a.click();URL.revokeObjectURL(url)});render()})();
  </script>
</body></html>
