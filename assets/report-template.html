    .preview-stage{width:100%;display:grid;place-items:center;gap:14px}.preview-states{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.preview-button{border:0;font-weight:680}.preview-button.secondary{background:#fff;color:#111;border:1px solid #bbb}.preview-button.disabled{opacity:.35}.preview-iconbutton{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:#111;color:#fff}.preview-input{display:flex;align-items:center;padding:0 12px;color:#888}.preview-check{display:flex;align-items:center;gap:8px}.preview-check i{width:18px;height:18px;border:1px solid #999;border-radius:4px;background:#111;box-shadow:inset 0 0 0 4px #fff}.preview-radio i{border-radius:50%}.preview-badge{padding:5px 9px;border-radius:999px;background:#111;color:#fff;font-size:11px}.preview-tabs{display:flex;border-bottom:1px solid #bbb}.preview-tabs span{padding:8px 14px}.preview-tabs span:first-child{border-bottom:2px solid #111;font-weight:700}.preview-tooltip{padding:8px 10px;border-radius:7px;background:#111;color:#fff;font-size:11px}.preview-toast{display:flex;align-items:center;gap:10px;width:82%;padding:12px;border:1px solid #bbb;border-radius:10px;background:#fff;box-shadow:0 12px 30px #0002}.preview-alert{width:82%;padding:12px;border-left:3px solid #111;background:#fff}.preview-divider{width:80%;height:1px;background:#aaa}.preview-text{font-size:28px;font-weight:680;letter-spacing:-.03em}.preview-formfield{width:80%;display:grid;gap:7px}.preview-formfield label{font-size:11px;font-weight:700}.preview-select{width:80%;height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border:1px solid #aaa;border-radius:8px;background:#fff}.preview-dialog{height:120px;padding:16px}.preview-card{height:120px;padding:14px}

    .finish-panel{padding:38px;border-radius:14px;background:#111;color:#fff}.finish-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#444}.finish-metric{padding:18px;background:#111}.finish-metric strong{display:block;font-size:30px}.finish-metric span{color:#aaa;font-size:10px}.finish-status{margin:28px 0;padding:18px 0;border-top:1px solid #444;border-bottom:1px solid #444}.finish-actions{display:flex;justify-content:space-between;align-items:center;gap:16px}.finish-actions p{margin:0;color:#aaa}.finish-actions .button{background:#fff;color:#111}
    @media(max-width:980px){.reference-layout{grid-template-columns:1fr}.reference-canvases{grid-template-columns:1fr}.component-grid{grid-template-columns:repeat(2,1fr)}.component-setup{grid-template-columns:1fr}.sheet-head{grid-template-columns:1fr}.module-progress{display:none}.color-framework{grid-template-columns:repeat(2,minmax(0,1fr))}.color-matrix-head,.color-matrix-row{grid-template-columns:minmax(190px,1.1fr) minmax(145px,.8fr) minmax(145px,.8fr) minmax(150px,.9fr) 120px}.color-format-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hardcoded-row{grid-template-columns:minmax(170px,1fr) minmax(150px,1fr) 90px minmax(160px,1fr) 116px}}
    @media(max-width:680px){:root{--page:calc(100vw - 28px)}.module-nav-inner{overflow:auto}.module-tab{white-space:nowrap}.hero{padding-top:38px}.reference-canvas{min-height:240px;padding:16px}.component-grid{grid-template-columns:1fr}.slice{grid-template-columns:1fr}.finish-grid{grid-template-columns:repeat(2,1fr)}.finish-actions{display:block}.finish-actions .button{margin-top:16px;width:100%}.sheet-kpis{grid-template-columns:repeat(2,1fr)}.color-framework{grid-template-columns:1fr 1fr}.color-palette-lane{grid-template-columns:1fr}.color-matrix-head{display:none}.color-matrix{border:0}.color-semantic-group{border:1px solid var(--line);margin-top:10px}.color-matrix-row{grid-template-columns:1fr 1fr;margin:10px;border:1px solid var(--line)}.color-token-cell,.color-usage,.color-decision{grid-column:1/-1}.color-matrix-row>div{position:relative;border-top:1px solid var(--line)}.color-matrix-row>div:first-child{border-top:0}.color-mode-name{display:block;position:absolute;right:7px;top:4px;color:inherit;font:7px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.5}.color-governance-summary,.hardcoded-summary{grid-template-columns:1fr 1fr}.color-governance-summary span:nth-child(3),.hardcoded-summary span:nth-child(3){border-left:0;border-top:1px solid var(--line)}.color-governance-summary span:nth-child(4),.hardcoded-summary span:nth-child(4){border-top:1px solid var(--line)}.color-format-grid{grid-template-columns:1fr}.hardcoded-row{grid-template-columns:1fr 1fr;margin:10px;border:1px solid var(--line)}.hardcoded-row>div{border-top:1px solid var(--line)}.hardcoded-row>div:first-child{grid-column:1/-1;border-top:0}.hardcoded-where,.hardcoded-target{grid-column:1/-1}.color-scene-head h5{font-size:18px}.type-framework{grid-template-columns:1fr 1fr}.type-family-grid{grid-template-columns:1fr}.type-table-head{display:none}.type-row{grid-template-columns:1fr 1fr;margin:10px;border:1px solid var(--line)}.type-row>div{border-top:1px solid var(--line)}.type-row>div:first-child{grid-column:1/-1;border-top:0}.type-purpose{grid-column:1/-1}.type-direct-row{grid-template-columns:1fr 1fr;margin:10px;border:1px solid var(--line)}.type-direct-row>div{border-top:1px solid var(--line)}.type-direct-row>div:first-child{grid-column:1/-1;border-top:0}.type-direct-where{grid-column:1/-1}}

<body>
  <header class="topbar"><div class="top-inner"><div class="brand"><span class="mark">TF</span><span>UITokenForge · UIKit Review</span></div><div class="spacer"></div><div class="locale"><button data-locale="zh">中</button><button data-locale="en">EN</button></div><button class="button" id="import-button" data-zh="导入上次评审" data-en="Import review"></button><input id="import-file" type="file" accept="application/json,.json" hidden></div></header>
  <header class="hero"><div class="eyebrow">Target UIKit · Migration Blueprint</div><h1 id="hero-title"></h1><div class="hero-bottom"><p class="hero-copy" data-zh="先看治理完成后的 UIKit，再把当前 Token、组件和直接样式映射进来。只有无法从源码确定的视觉与产品问题，才进入待决策中心。" data-en="Start with the UIKit you are building, then map current Tokens, components, and direct values into it. Only genuine visual or product ambiguity enters the decision center."></p><div class="hero-rule"><strong data-zh="旧资产只有三种最终动作" data-en="Three final actions for legacy assets"></strong><span data-zh="迁移 · 合并 · 删除。待决策只是临时状态。" data-en="Migrate · Merge · Delete. Pending decision is temporary."></span></div></div></header>
  <div class="metric-strip" id="metrics"></div>
  <nav class="module-nav" aria-label="Review modules"><div class="module-nav-inner">
    <button class="module-tab" data-module-target="uikit"><span data-zh="UIKit 框架" data-en="UIKit"></span><span class="module-tab-count" id="uikit-count"></span></button>
    <button class="module-tab" data-module-target="governance"><span data-zh="治理批次" data-en="Governance"></span><span class="module-tab-count" id="governance-count"></span></button>
    <button class="module-tab" data-module-target="decisions"><span data-zh="待决策" data-en="Decisions"></span><span class="module-tab-count" id="decisions-count"></span></button>
    <button class="module-tab" data-module-target="validation"><span data-zh="视觉验证" data-en="Validation"></span><span class="module-tab-count" id="validation-count"></span></button>
    <button class="module-tab" data-module-target="finish"><span data-zh="完成" data-en="Finish"></span></button>
    <div class="module-progress"><span id="module-progress-label"></span><i id="module-progress-bar"></i></div>
  </div></nav>
  <div class="layout">
    <main>
      <div class="workspace" data-module="uikit">
      <section class="section" id="uikit"><div class="section-head"><div><div class="eyebrow" data-zh="最终要建设什么" data-en="What you are building"></div><h2 data-zh="目标 UIKit 全景" data-en="Target UIKit skeleton"></h2></div><p data-zh="固定的标准组件库骨架不会因为源码没扫到某个组件就消失；项目真实内容只决定每个节点的建设状态。" data-en="The standard UIKit skeleton does not disappear when a component is absent from source. Project evidence only determines each node's delivery status."></p></div><div class="architecture" id="architecture"></div><div id="uikit-skeleton"></div></section>
      <section class="section" id="foundation"><div class="section-head"><div><div class="eyebrow" data-zh="先目标，后映射" data-en="Target first, mapping second"></div><h2 data-zh="Foundation 基础规范" data-en="Foundation system"></h2></div><p data-zh="每一类先展示治理后的目标规范，再展示当前项目如何迁移、合并或删除。源码证据被折叠到最后。" data-en="Each category shows the target system first, followed by how current source migrates, merges, or deletes. Source evidence stays collapsed."></p></div><div id="foundation-sheets"></div></section>
      <section class="section" id="components"><div class="section-head"><div><div class="eyebrow" data-zh="静态结构 + 动态契约" data-en="Static anatomy + dynamic contract"></div><h2 data-zh="组件系统" data-en="Component system"></h2></div><p data-zh="组件节点包含结构、变体、尺寸、状态和行为契约。发现源码文件不等于组件已经合格。" data-en="Every component node defines anatomy, variants, sizes, states, and behavior. Finding a source file does not mean the component is complete."></p></div><div id="component-system"></div></section>
      </div>
      <div class="workspace" data-module="governance">
      <section class="section" id="migration"><div class="section-head"><div><div class="eyebrow" data-zh="旧资产如何退出" data-en="How legacy assets exit"></div><h2 data-zh="迁移、合并与删除" data-en="Migrate, merge, and delete"></h2></div><p data-zh="这里是执行清单，不是设计决策。建议删除必须等源码引用清零并完成真实页面验证后才能执行。" data-en="This is an execution ledger, not the decision room. Suggested deletion requires zero source usage and verified real page states."></p></div><div class="toolbar"><label><span data-zh="搜索 Token、功能或文件" data-en="Search Token, feature, or file"></span><input id="migration-search" type="search"></label><label><span data-zh="动作" data-en="Action"></span><select id="migration-filter"><option value="all" data-zh="全部" data-en="All"></option><option value="migrate" data-zh="迁移" data-en="Migrate"></option><option value="merge" data-zh="合并" data-en="Merge"></option><option value="delete" data-zh="删除" data-en="Delete"></option></select></label></div><div class="governance-batches" id="migration-list"></div></section>
      </div>
      <div class="workspace" data-module="decisions">
      <section class="section" id="decisions"><div class="section-head"><div><div class="eyebrow" data-zh="只看需要你判断的差异" data-en="Only choices that need you"></div><h2 data-zh="待决策中心" data-en="Decision center"></h2></div><p data-zh="看元素对比，选择处理方式。" data-en="Compare the elements, then choose an action."></p></div><div class="toolbar"><label><span data-zh="搜索问题" data-en="Search decisions"></span><input id="decision-search" type="search"></label><div id="decision-progress"></div></div><div class="decision-list" id="decision-list"></div></section>
      </div>
      <div class="workspace" data-module="validation">
      <section class="section" id="implementation"><div class="section-head"><div><div class="eyebrow" data-zh="改代码前先定义如何验收" data-en="Define proof before source changes"></div><h2 data-zh="实施批次与视觉验证" data-en="Implementation and visual validation"></h2></div><p data-zh="每个产品切片都绑定真实功能、页面和状态。治理完成后，产物 C 会在同一清单里对比治理前后。" data-en="Every product slice binds real features, pages, and states. After implementation, artifact C compares before and after against this same checklist."></p></div><div class="slice-list" id="slice-list"></div></section>
      </div>
      <div class="workspace" data-module="finish">
      <section class="section" id="finish"><div class="section-head"><div><div class="eyebrow" data-zh="确认评审边界" data-en="Confirm the review boundary"></div><h2 data-zh="完成并交回 Codex" data-en="Finish and return to Codex"></h2></div><p data-zh="这里汇总批量批准、待决策结果、组件搭建选择和视觉验证范围。一次导出即可继续治理。" data-en="This summarizes batch approvals, decisions, component-build intent, and visual validation. One export continues the governance workflow."></p></div><div id="finish-panel"></div></section>
      </div>
    </main>
  </div>
  <script type="application/json" id="report-data">{{REPORT_JSON}}</script>
  <script>
  (()=>{
    const report=JSON.parse(document.getElementById("report-data").textContent),ui=report.uikitBlueprint,contract=report.tokenContract,brief=report.reviewBrief;
    const localeKey="govern-ui:locale",stateKey=`govern-ui:uikit-review:${report.reportId}`;
    let locale=(()=>{try{const saved=localStorage.getItem(localeKey);if(saved==="zh"||saved==="en")return saved}catch{}return (navigator.language||"").toLowerCase().startsWith("zh")?"zh":"en"})();
    let state=(()=>{try{return JSON.parse(localStorage.getItem(stateKey)||"{}")}catch{return{}}})();state.lifecycle=state.lifecycle||{};state.decisions=state.decisions||{};state.batchApprovals=state.batchApprovals||{};state.colorChoices=state.colorChoices||{};state.componentPlan=state.componentPlan||null;state.activeModule=state.activeModule||"uikit";
    const e=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[char]));
    const l=value=>typeof value==="string"?value:(value?.[locale]??value?.en??value?.zh??"");
    const tx=(zh,en)=>locale==="zh"?zh:en;
    const actionLabel=action=>({migrate:tx("迁移","Migrate"),merge:tx("合并","Merge"),delete:tx("删除","Delete")}[action]||action);
    const statusLabel=status=>({existing:tx("已具备","Existing"),"migration-ready":tx("可直接迁移","Migration ready"),"needs-consolidation":tx("需要合并","Needs consolidation"),"needs-decision":tx("待决策","Needs decision"),missing:tx("尚未建设","Missing")}[status]||status);
    const save=()=>{try{localStorage.setItem(stateKey,JSON.stringify(state))}catch{}};
    const download=(name,payload)=>{const blob=new Blob([JSON.stringify(payload,null,2)+"\n"],{type:"application/json"}),url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;link.click();URL.revokeObjectURL(url)};
    const safeColor=value=>typeof value==="string"&&/^(?:#(?:[0-9a-f]{3,8})|rgba?\([^;{}]+\)|hsla?\([^;{}]+\)|oklch\([^;{}]+\)|transparent|black|white)$/i.test(value.trim())?value.trim():"#ecece7";
    function applyLocale(){document.documentElement.lang=locale==="zh"?"zh-CN":"en";document.documentElement.dataset.locale=locale;document.querySelectorAll("[data-zh][data-en]").forEach(node=>node.textContent=node.dataset[locale]);document.querySelectorAll("[data-locale]").forEach(node=>node.classList.toggle("active",node.dataset.locale===locale));document.querySelectorAll("option[data-zh]").forEach(node=>node.textContent=node.dataset[locale])}
    function status(status){return `<span class="status ${e(status)}"><i class="dot ${e(status)}"></i>${e(statusLabel(status))}</span>`}
    function progressSnapshot(){const batches=governanceBatches(),approved=batches.filter(item=>state.batchApprovals[item.id]).length,decided=brief.decisionPackages.filter(item=>state.decisions[item.id]?.decision).length,componentRequired=ui.componentSetup?.mode==="starter-proposal",componentDone=!componentRequired||Boolean(state.componentPlan),total=batches.length+brief.decisionPackages.length+(componentRequired?1:0),done=approved+decided+(componentDone&&componentRequired?1:0);return{batches,approved,decided,componentRequired,componentDone,total,done,percent:total?Math.round(done/total*100):100}}
    function setActiveModule(moduleId,{persist=true,scroll=true}={}){state.activeModule=document.querySelector(`[data-module="${moduleId}"]`)?moduleId:"uikit";document.querySelectorAll("[data-module]").forEach(node=>node.classList.toggle("active",node.dataset.module===state.activeModule));document.querySelectorAll("[data-module-target]").forEach(node=>node.classList.toggle("active",node.dataset.moduleTarget===state.activeModule));if(persist)save();if(scroll)window.scrollTo({top:document.querySelector(".module-nav").offsetTop,behavior:"smooth"})}
    function renderChrome(){document.getElementById("hero-title").textContent=tx(`目标 UIKit — ${report.repoProfile.rootName}`,`Target UIKit — ${report.repoProfile.rootName}`);const s=ui.summary,p=progressSnapshot();document.getElementById("metrics").innerHTML="";document.getElementById("uikit-count").textContent=s.targetNodes;document.getElementById("governance-count").textContent=p.batches.length;document.getElementById("decisions-count").textContent=brief.decisionPackages.length-p.decided;document.getElementById("validation-count").textContent=ui.implementationSlices.length;document.getElementById("module-progress-label").textContent=tx(`${p.done}/${p.total} 已确认`,`${p.done}/${p.total} confirmed`);document.getElementById("module-progress-bar").style.setProperty("--progress",`${p.percent}%`)}
    function renderArchitecture(){document.getElementById("architecture").innerHTML=contract.framework.layers.map((item,index)=>`<article><small>0${index+1}</small><h3>${e(l(item.label))}</h3><p>${e(l(item.purpose))}</p></article>`).join("")}
    function nodeCard(item,foundation=false){const counts=foundation?(item.id==="iconography"?`<span class="mini">${item.iconReview.summary.uiIcons} UI Icons</span><span class="mini">${item.iconReview.summary.delete} ${tx("建议删除","delete")}</span><span class="mini">${item.iconReview.summary.externalCheck} ${tx("外部核验","external checks")}</span>`:`<span class="mini">${item.targetCount} ${tx("目标","target")}</span><span class="mini">${item.currentCount} ${tx("现有","current")}</span>${item.decisionCount?`<span class="mini">${item.decisionCount} ${tx("决策","decisions")}</span>`:""}`):`<span class="mini">${item.currentCount} ${tx("实现","implementations")}</span>${item.decisionCount?`<span class="mini">${item.decisionCount} ${tx("决策","decisions")}</span>`:""}`;return `<a class="node-card" href="${foundation?`#foundation-${e(item.id)}`:"#components"}"><div class="node-top"><h4>${e(l(item.label))}</h4>${status(item.status)}</div><p>${e(foundation?l(item.description):tx("结构、变体、尺寸、状态与行为契约。","Anatomy, variants, sizes, states, and behavior."))}</p><div class="node-counts">${counts}</div></a>`}
    function renderSkeleton(){const foundation=`<section class="skeleton-block"><header class="skeleton-title"><div><h3>Foundation</h3><p>${tx("基础视觉语言与全局语义","Foundational visual language and global semantics")}</p></div><span>${ui.foundation.length}</span></header><div class="node-grid">${ui.foundation.map(item=>nodeCard(item,true)).join("")}</div></section>`;const components=ui.componentLayers.map(layer=>`<section class="skeleton-block"><header class="skeleton-title"><div><h3>${e(l(layer.label))}</h3><p>${e(l(layer.description))}</p></div><span>${layer.nodes.length}</span></header><div class="node-grid">${layer.nodes.map(item=>nodeCard(item)).join("")}</div></section>`).join("");const patterns=`<section class="skeleton-block"><header class="skeleton-title"><div><h3>Patterns</h3><p>${tx("从当前功能位置识别出的产品模式","Product patterns inferred from current feature locations")}</p></div><span>${ui.patterns.length}</span></header><div class="node-grid">${ui.patterns.length?ui.patterns.map(item=>`<article class="node-card"><div class="node-top"><h4>${e(item.label)}</h4>${status(item.status)}</div><p>${tx("需要在真实页面状态中建立视觉回归覆盖。","Requires visual-regression coverage across real page states.")}</p></article>`).join(""):`<div class="empty">${tx("没有识别出产品模式","No product patterns identified")}</div>`}</div></section>`;document.getElementById("uikit-skeleton").innerHTML=`<div class="subhead"><h3>${tx("标准骨架与当前建设状态","Standard skeleton and current delivery state")}</h3></div>${foundation}${components}${patterns}`}
    const graphicKindLabel=kind=>({"ui-icon":tx("UI 图标","UI Icon"),"brand-mark":tx("品牌标志","Brand mark"),illustration:tx("插画与营销图形","Illustration"),placeholder:tx("占位与空状态","Placeholder"),cursor:tx("光标","Cursor"),"graphic-asset":tx("其他图形","Other graphic")}[kind]||kind);

    function renderComponents(){const setup=ui.componentSetup||{mode:"map-existing",scannedCandidates:0,proposedCount:0,proposedComponentIds:[]},starter=setup.mode==="starter-proposal",setupMarkup=`<section class="component-setup"><div><div class="eyebrow">${starter?tx("未扫描到共享组件系统","No shared component system detected"):tx("映射现有组件","Map existing components")}</div><h3>${starter?tx(`Starter UIKit 提案 · ${setup.proposedCount} 个核心组件`,`Starter UIKit proposal · ${setup.proposedCount} core components`):tx(`${setup.scannedCandidates} 个源码组件候选`,` ${setup.scannedCandidates} source component candidates`)}</h3><p>${starter?tx("当前只生成可评审的组件规范；只有批准后，完整版才会创建源码组件。","This review proposes the component contracts only. The full workflow writes source components only after approval."):tx("先判断现有组件能否成为 owner，再补齐缺失状态；Review 不直接写代码。","Review existing owners first, then complete missing states. Review does not write source.")}</p></div><div class="component-setup-actions">${starter?[['build',tx("批准搭建","Approve build")],['defer',tx("暂不搭建","Defer")]].map(([value,label])=>`<button class="button ${state.componentPlan===value?"primary":""}" data-component-plan="${value}">${e(label)}</button>`).join(""):`<span class="status existing">${tx("使用现有系统","Use existing system")}</span>`}</div></section>`;document.getElementById("component-system").innerHTML=setupMarkup+ui.componentLayers.map(layer=>`<section class="component-layer"><header class="component-layer-head"><div><h3>${e(l(layer.label))}</h3><p>${e(l(layer.description))}</p></div><span>${layer.nodes.length}</span></header><div class="component-grid">${layer.nodes.map(node=>{const source=node.owners.map(item=>item.file).join(" · ")||node.adapters.map(item=>item.file).join(" · ");return`<article class="component-card ${node.proposal?"proposal":""}"><header class="component-card-head"><div><h4>${e(l(node.label))}</h4>${node.proposal?`<span class="mini">${tx("Starter 提案","Starter proposal")}</span>`:""}</div>${status(node.status)}</header><div class="component-preview">${preview(node.id)}</div><div class="contract-tabs">${[[tx("结构","Anatomy"),node.contract.anatomy],[tx("变体","Variants"),node.contract.variants],[tx("尺寸","Sizes"),node.contract.sizes],[tx("状态","States"),node.contract.states]].map(([label,values])=>`<div><strong>${e(label)}</strong><span title="${e(values.join(" · "))}">${e(values.join(" · "))}</span></div>`).join("")}</div><div class="component-source-state"><strong>${source?tx("已找到源码实现","Source implementation found"):node.proposal?tx("批准后新建","Create after approval"):tx("当前不在 Starter 范围","Outside Starter scope")}</strong><span>${e(source||node.buildRecommendation||tx("本次不自动搭建","Not auto-built in this pass"))}</span></div></article>`}).join("")}</div></section>`).join("")}
    function governanceBatches(){const groups=new Map();for(const action of ui.actions){const key=action.foundationId||action.category||"other";if(!groups.has(key))groups.set(key,{id:`batch-${key}`,key,actions:[]});groups.get(key).actions.push(action)}return[...groups.values()].sort((a,b)=>a.key.localeCompare(b.key))}
    function migrationRow(action){const current=action.currentTokens.map(token=>`<code>${e(token.name)}</code><small>${e(token.file)}:${token.line}</small>`).join("")||`<small>${tx("直接样式值","Direct source value")}</small>`;const target=action.targetToken?`<code>${e(action.targetToken.name)}</code>`:`<small>${tx("通过验证后删除","Delete after validation")}</small>`;const where=[...action.features,...action.components,...action.pages].slice(0,8);return `<div class="migration-row" data-action-id="${e(action.id)}" data-action="${e(action.action)}"><div class="migration-current">${current}</div><div class="migration-arrow">→</div><div class="migration-target">${target}<span class="status ${action.action==="merge"?"needs-consolidation":action.action==="delete"?"missing":"migration-ready"}">${e(actionLabel(action.action))}</span></div><div class="migration-where">${where.map(item=>`<span class="mini">${e(item)}</span>`).join(" ")||e(action.verification)}</div></div>`}
    function batchLabel(batch){const node=ui.foundation.find(item=>item.id===batch.key);return node?l(node.label):batch.key}
    function renderMigration(){const query=document.getElementById("migration-search").value.trim().toLowerCase(),filter=document.getElementById("migration-filter").value,batches=governanceBatches().map(batch=>({...batch,visible:batch.actions.filter(item=>(filter==="all"||item.action===filter)&&[item.action,item.targetToken?.name,...item.currentTokens.flatMap(token=>[token.name,token.file]),...item.features,...item.components,...item.pages].join(" ").toLowerCase().includes(query))})).filter(batch=>batch.visible.length);document.getElementById("migration-list").className="governance-batches";document.getElementById("migration-list").innerHTML=batches.length?batches.map(batch=>{const counts={migrate:0,merge:0,delete:0};batch.actions.forEach(item=>counts[item.action]=(counts[item.action]||0)+1);const approved=Boolean(state.batchApprovals[batch.id]);return`<article class="governance-batch" data-batch-id="${e(batch.id)}"><header class="batch-head"><div class="batch-title"><div class="eyebrow">${tx("Foundation 治理批次","Foundation governance batch")}</div><h3>${e(batchLabel(batch))}</h3><p>${counts.migrate} ${tx("迁移","migrate")} · ${counts.merge} ${tx("合并","merge")} · ${counts.delete} ${tx("删除","delete")} · ${batch.actions.length} ${tx("项","items")}</p></div><div class="batch-actions">${approved?`<span class="batch-approved">✓ ${tx("已批准建议","Recommendations approved")}</span>`:""}<button class="button ${approved?"":"primary"}" data-approve-batch="${e(batch.id)}">${approved?tx("取消批准","Undo"):tx("批准本批次","Approve batch")}</button></div></header><details class="batch-detail" ${query||filter!=="all"?"open":""}><summary>${tx(`查看 ${batch.visible.length} 项映射和功能位置`,`View ${batch.visible.length} mappings and product locations`)}</summary><div class="migration-list">${batch.visible.map(migrationRow).join("")}</div></details></article>`}).join(""):`<div class="empty">${tx("没有符合条件的治理项","No matching governance item")}</div>`}
    const renderableColor=value=>typeof value==="string"&&/^(?:#(?:[0-9a-f]{3,8})|rgba?\([^;{}]+\)|hsla?\([^;{}]+\)|oklch\([^;{}]+\)|transparent|black|white)$/i.test(value.trim());
    const specimenSize=value=>{const number=Number.parseFloat(value);return Number.isFinite(number)?Math.min(240,Math.max(16,number*(/rem/i.test(value)?32:4))):72};
    function specimen(item){const type=item.type||"value",value=String(item.value||""),label=l(item.label)||value,display=l(item.display)||value||label,detail=l(item.detail)||"";let visual;if(type==="color"){visual=renderableColor(value)?`<span class="specimen-color-chip" style="background:${e(safeColor(value))}"></span>`:`<code>${e(display)}</code>`}else if(type==="spacing"){visual=`<span class="specimen-space" style="width:${specimenSize(value)}px"></span>`}else if(type==="radius"){visual=`<span class="specimen-radius" style="border-radius:${e(/^[\d.]+(?:px|rem|em|%)$/i.test(value.trim())?value.trim():"12px")}"></span>`}else if(type==="typography"){visual=`<strong class="specimen-type">Ag 设计 0123</strong>`}else if(type==="ownership"){visual=`<span class="specimen-owner"><code>${e(display)}</code></span>`}else if(type==="rule"){visual=`<span class="specimen-rule"><strong>${e(display)}</strong></span>`}else if(type==="component"){visual=preview(item.component||"generic")}else{visual=`<code>${e(display)}</code>`}return `<article class="specimen"><div class="specimen-visual ${e(type)} ${type==="color"&&!renderableColor(value)?"unresolved":""}">${visual}</div><div class="specimen-body"><strong>${e(label)}</strong>${value&&value!==label?`<code>${e(value)}</code>`:""}${detail?`<code>${e(detail)}</code>`:""}</div></article>`}
    function decisionCard(item){const selected=state.decisions[item.id]?.decision;return `<article class="decision-card" data-decision-id="${e(item.id)}"><header class="decision-head"><div><div class="decision-meta"><span class="status needs-decision">${tx("待决策","Needs decision")}</span><span class="mini">${e(item.systemPath?.category||item.category)}</span></div><h3>${e(l(item.question)||l(item.title))}</h3></div></header><div class="decision-stage"><section class="compare-panel"><div class="compare-label"><span>${tx("现在","Current")}</span><span>${item.current.specimens.length}</span></div><div class="specimen-board">${item.current.specimens.map(specimen).join("")||`<div class="empty">—</div>`}</div></section><div class="decision-stage-arrow">→</div><section class="compare-panel"><div class="compare-label"><span>${tx("目标","Target")}</span><span>UIKit</span></div><div class="specimen-board target">${item.target.specimens.map(specimen).join("")||`<div class="empty">—</div>`}</div></section></div><div class="recommendation"><span class="recommendation-label">${tx("建议","Recommendation")}</span><strong>${e(l(item.recommendation.summary))}</strong></div><div class="decision-choices">${item.choices.map(choice=>`<label class="decision-choice"><input type="radio" name="decision-${e(item.id)}" value="${e(choice.decision)}" ${selected===choice.decision?"checked":""}>${e(l(choice.label))}${choice.decision===item.recommendation.decision?` · ${tx("建议","recommended")}`:""}<span class="resolution">${choice.resolutionAction?e(actionLabel(choice.resolutionAction)):tx("待定","Pending")}</span><small>${e(l(choice.consequence))}</small></label>`).join("")}</div><details class="decision-more"><summary>${tx("补充背景与源码证据","Context and source evidence")}</summary><textarea data-note placeholder="${tx("补充页面或产品背景（可选）","Add page or product context (optional)")}">${e(state.decisions[item.id]?.note||"")}</textarea><details class="evidence"><summary>${tx("查看源码证据（工程师）","View source evidence (engineers)")}</summary>${item.evidence.flatMap(group=>group.sourceRefs).map(ref=>`<div class="evidence-row"><code>${e(ref.file)}:${ref.line}</code><span>${e(ref.excerpt)}</span><span>${e(l(item.recommendation.reasons[0]))}</span></div>`).join("")}</details></details></article>`}
    function renderDecisions(){const query=document.getElementById("decision-search").value.trim().toLowerCase(),items=brief.decisionPackages.filter(item=>[l(item.title),l(item.question),l(item.current.summary),l(item.target.summary),item.systemPath?.category].join(" ").toLowerCase().includes(query));document.getElementById("decision-list").innerHTML=items.length?items.map(decisionCard).join(""):`<div class="empty">${tx("没有符合条件的待决策问题","No matching decision")}</div>`;const done=brief.decisionPackages.filter(item=>state.decisions[item.id]?.decision).length;document.getElementById("decision-progress").textContent=tx(`已完成 ${done}/${brief.decisionPackages.length}`,`${done}/${brief.decisionPackages.length} decided`)}
    function renderSlices(){document.getElementById("slice-list").innerHTML=ui.implementationSlices.map((slice,index)=>`<article class="slice"><div><div class="slice-top"><div><span class="sheet-index">${String(index+1).padStart(2,"0")}</span><h3>${e(l(slice.label))}</h3></div>${slice.blocked?status("needs-decision"):status("migration-ready")}</div><div class="slice-flow"><span>${slice.actions.migrate} ${tx("迁移","migrate")}</span><span>${slice.actions.merge} ${tx("合并","merge")}</span><span>${slice.actions.delete} ${tx("删除","delete")}</span></div><strong>${tx("真实功能与页面","Real features and pages")}</strong><p>${e(slice.functions.join(" · ")||tx("实施前补充页面路由","Add page routes before implementation"))}</p></div><div><strong>${tx("必须截图的状态","Required screenshot states")}</strong><div class="validation-grid">${slice.validationStates.map((item,stateIndex)=>`<div class="validation-state"><strong>${String(stateIndex+1).padStart(2,"0")}</strong><span>${e(item)}</span></div>`).join("")}</div></div></article>`).join("")||`<div class="empty">${tx("当前没有需要实施的治理批次","No implementation slice is required")}</div>`}
    function directStyleDecisionPayload(){const colorNode=ui.foundation.find(item=>item.id==="color");if(!colorNode)return[];const targets=colorTargets(colorNode),approved=Boolean(state.batchApprovals["batch-color"]);return(colorNode.directStyles||[]).map(item=>{const recommendation=hardcodedRecommendation(item,targets,colorNode);return{directStyleId:item.id,foundationId:"color",batchId:"batch-color",action:recommendation.kind,targetToken:recommendation.kind==="migrate"?recommendation.target:null,approved,normalizedValue:item.normalizedColor||null,sourceValues:item.sourceValues||[item.value],occurrences:item.occurrences||0,properties:item.properties||[item.property].filter(Boolean),files:item.files||[],examples:item.examples||[]}})}
    function exportPayload(){const packageDecisions=brief.decisionPackages.flatMap(item=>{const selected=state.decisions[item.id]?.decision;if(!selected)return[];const choice=item.choices.find(candidate=>candidate.decision===selected);return[{packageId:item.id,systemPath:item.systemPath,conflictIds:item.conflictIds,findingFingerprints:item.findingFingerprints||[],decision:selected,resolutionAction:choice?.resolutionAction||null,note:state.decisions[item.id].note||""}]});const iconNode=ui.foundation.find(item=>item.id==="iconography"),assetLifecycleDecisions=(iconNode?.assets||[]).map(asset=>({assetId:asset.id,name:asset.name,kind:asset.kind,source:asset.collection||asset.source,recommendedAction:asset.governance?.recommendation||"keep",target:asset.governance?.target||null,decisionStatus:asset.governance?.decisionStatus||"auto-recommended",deleteEligibility:asset.governance?.deleteEligibility||"not-qualified",remainingChecks:(asset.governance?.checks||[]).filter(check=>check.status!=="passed").map(check=>({id:check.id,status:check.status}))}));return{schemaVersion:4,reportId:report.reportId,repoId:report.repoId,status:"draft",batchApprovals:governanceBatches().map(batch=>({batchId:batch.id,foundationId:batch.key,approved:Boolean(state.batchApprovals[batch.id]),actionIds:batch.actions.map(item=>item.id)})),componentBuildDecision:{mode:ui.componentSetup?.mode||"map-existing",decision:state.componentPlan||(ui.componentSetup?.mode==="starter-proposal"?"pending":"use-existing"),componentIds:ui.componentSetup?.proposedComponentIds||[]},colorSemanticDecisions:Object.entries(state.colorChoices).map(([token,decision])=>({token,decision})),tokenLifecycleDecisions:ui.actions.map(item=>({lifecycleId:item.id,recommendedAction:item.action,action:item.action,batchId:`batch-${item.foundationId||item.category||"other"}`,approved:Boolean(state.batchApprovals[`batch-${item.foundationId||item.category||"other"}`])})),directStyleDecisions:directStyleDecisionPayload(),assetLifecycleDecisions,assetBatches:iconNode?.iconReview?.batches||[],packageDecisions,visualValidationSlices:ui.implementationSlices}}
    function renderFinish(){const p=progressSnapshot(),pendingDecisions=brief.decisionPackages.length-p.decided,pendingBatches=p.batches.length-p.approved,componentText=p.componentRequired?(state.componentPlan==="build"?tx("批准搭建 Starter UIKit","Starter UIKit approved"):state.componentPlan==="defer"?tx("暂不搭建组件","Component build deferred"):tx("尚未选择组件搭建方案","Component build undecided")):tx("沿用并治理现有组件系统","Use and govern existing components");document.getElementById("finish-panel").innerHTML=`<div class="finish-panel"><div class="finish-grid">${[[p.approved,tx("已批准治理批次","Approved batches")],[p.decided,tx("已完成决策","Completed decisions")],[ui.implementationSlices.length,tx("视觉验证切片","Validation slices")],[p.percent+"%",tx("评审完成度","Review progress")]].map(([value,label])=>`<div class="finish-metric"><strong>${value}</strong><span>${e(label)}</span></div>`).join("")}</div><div class="finish-status"><strong>${e(componentText)}</strong><p>${pendingBatches||pendingDecisions?tx(`还剩 ${pendingBatches} 个治理批次、${pendingDecisions} 个设计决策未确认。`,` ${pendingBatches} governance batches and ${pendingDecisions} design decisions remain.`):tx("评审信息已完整，可以交回 Codex 执行。","The review is complete and ready for Codex.")}</p><div class="export-status" id="export-status"></div></div><div class="finish-actions"><p>${tx("将同时下载决策 JSON 与目标 Token 契约；无需把 HTML 文件传回来。","Downloads the decision JSON and target Token contract together. The HTML does not need to be returned.")}</p><button class="button" id="finish-export-button">${tx("导出并继续治理","Export and continue")}</button></div></div>`}
    function renderAll(){applyLocale();renderArchitecture();renderSkeleton();renderFoundation();renderComponents();renderMigration();renderDecisions();renderSlices();renderFinish();renderChrome();setActiveModule(state.activeModule,{persist:false,scroll:false})}
    document.querySelector(".locale").addEventListener("click",event=>{const button=event.target.closest("[data-locale]");if(!button)return;locale=button.dataset.locale;try{localStorage.setItem(localeKey,locale)}catch{}renderAll()});

    document.getElementById("decision-search").addEventListener("input",renderDecisions);document.getElementById("decision-list").addEventListener("change",event=>{const card=event.target.closest("[data-decision-id]");if(!card||event.target.type!=="radio")return;state.decisions[card.dataset.decisionId]={...(state.decisions[card.dataset.decisionId]||{}),decision:event.target.value};save();renderAll()});document.getElementById("decision-list").addEventListener("input",event=>{if(!event.target.matches("[data-note]"))return;const card=event.target.closest("[data-decision-id]");state.decisions[card.dataset.decisionId]={...(state.decisions[card.dataset.decisionId]||{}),note:event.target.value};save()});
    document.getElementById("finish-panel").addEventListener("click",event=>{if(!event.target.closest("#finish-export-button"))return;download("govern-ui-decisions.json",exportPayload());download("govern-ui-token-contract.json",{...contract,lifecycle:ui.actions.map(item=>({...item,approvedAction:item.action,approved:Boolean(state.batchApprovals[`batch-${item.foundationId||item.category||"other"}`])}))});const node=document.getElementById("export-status");if(node)node.textContent=tx("已导出评审结果与目标契约。","Exported review decisions and the target contract.")});
    document.getElementById("import-button").addEventListener("click",()=>document.getElementById("import-file").click());document.getElementById("import-file").addEventListener("change",async event=>{const file=event.target.files[0];if(!file)return;try{const payload=JSON.parse(await file.text());if(payload.reportId&&payload.reportId!==report.reportId)throw new Error("report mismatch");for(const item of payload.batchApprovals||[])state.batchApprovals[item.batchId]=Boolean(item.approved);for(const item of payload.tokenLifecycleDecisions||[])if(item.batchId&&typeof item.approved==="boolean")state.batchApprovals[item.batchId]=item.approved;for(const item of payload.colorSemanticDecisions||[])if(item.token&&item.decision)state.colorChoices[item.token]=item.decision;for(const item of payload.packageDecisions||[])state.decisions[item.packageId]={decision:item.decision,note:item.note||""};if(payload.componentBuildDecision?.decision&&!['pending','use-existing'].includes(payload.componentBuildDecision.decision))state.componentPlan=payload.componentBuildDecision.decision;save();renderAll();setActiveModule("finish");const node=document.getElementById("export-status");if(node)node.textContent=tx("已导入上次评审。","Previous review imported.")}catch(error){setActiveModule("finish");const node=document.getElementById("export-status");if(node)node.textContent=error.message}event.target.value=""});
    renderAll();
  })();
