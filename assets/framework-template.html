<script>
const catalog=JSON.parse(document.querySelector('#framework-catalog').textContent);
const input=JSON.parse(document.querySelector('#framework-input').textContent);
const KEY=input.storageKey||'governui-framework-'+input.project+'-v2';
const clone=x=>structuredClone(x),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={undecided:['待选择','Undecided'],adopt:['采用','Adopt'],unused:['暂不使用','Unused'],defer:['稍后决定','Defer'],define:['定义语义 Token','1 Define roles'],bind:['2 绑定样式','2 Bind styles'],locked:['已确认','Confirmed'],draft:['草稿','Draft'],edit:['编辑','Edit'],save:['保存','Save'],cancel:['取消','Cancel'],binding:['绑定样式','Bind style'],revision:['创建新修订','Create revision'],confirm:['确认本类决策','Confirm category decision'],reason:['选择理由','Decision reason'],pending:['尚未绑定','Not bound'],export:['导出完整框架','Export full framework'],manual:['导出设计手册','Export design manual'],add:['添加新的语义 Token','Add semantic Token'],remove:['删除','Delete'],undo:['撤销删除','Undo delete'],observed:['本次摸底已发现','Detected in this scope'],missing:['本次摸底未发现','Not detected in this scope'],unverified:['尚未核查','Unverified'],evidence:['使用证据','Usage evidence'],history:['确认记录','Confirmed versions'],diff:['查看修订差异','Review revision changes']};
function blankCategory(c){return {id:c.id,adoption:'undecided',reason:'',rule:clone(c.rule),version:1,stage:'define',locked:false,rows:c.roles.map(r=>({...clone(r),scope:['项目共享（待确认）','Project shared (proposed)'],binding:null,custom:false})),history:[],removedRows:[]}}
function initial(){const s={schema:'governui.framework/2',selectionModel:'presence',legacyRoleSelectionRecord:null,catalogSchema:catalog.schema,project:input.project,baseline:input.baseline,scope:input.scope,lang:'zh',categories:catalog.categories.map(blankCategory),legacyColorRecord:null};const color=s.categories.find(c=>c.id==='color');for(const row of input.colorSeed||[]){const current=color.rows.find(x=>x.id===row.id);const r={id:row.id,name:row.name,label:current?.label||[row.name,row.name],meaning:[row.meaning,row.meaningEn||row.meaning],location:[row.location,row.locationEn||row.location],scope:[row.scope,row.scopeEn||row.scope],binding:null,candidate:row.candidate,custom:!current,legacyGroup:row.group};if(current)Object.assign(current,r);else color.rows.push(r)}return s}
function importLegacy(s,old){s.legacyColorRecord=clone(old);const color=s.categories.find(c=>c.id==='color');color.version=(Number.isInteger(old.version)?old.version:1)+1;for(const row of old.rows){const current=color.rows.find(r=>r.id===row.id);const b=row.binding;const next={id:row.id,name:row.name,label:current?.label||[row.name,row.name],meaning:[row.meaning,row.meaningEn||row.meaning],location:[row.location,row.locationEn||row.location],scope:[row.scope,row.scopeEn||row.scope],candidate:row.candidate,custom:!current,legacyGroup:row.group,binding:b?{values:{light:b.light,dark:b.dark},owner:b.owner,ownerStatus:b.sourceId==='custom'?'proposed':'source-reference',sourceId:b.sourceId,sourceEvidence:b.sourceEvidence||null}:null};if(current)Object.assign(current,next);else color.rows.push(next)}s.lang=old.lang==='en'?'en':'zh'}
let state=initial(),storageOK=true,loadIssue=false;
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(saved.schema==='governui.framework/2'&&saved.baseline===input.baseline&&saved.project===input.project&&Array.isArray(saved.categories)&&saved.categories.every(c=>Array.isArray(c.rows)&&Array.isArray(c.history))){const originalSaved=clone(saved);state.defaultsVersion=saved.defaultsVersion||0;state.confirmation=saved.confirmation||null;state.confirmationHistory=saved.confirmationHistory||[];state.frameworkRevision=saved.frameworkRevision||1;state.requiresMappingReview=saved.requiresMappingReview||false;for(const c of state.categories){const existing=saved.categories.find(x=>x.id===c.id);if(existing){Object.assign(c,existing);c.removedRows=existing.removedRows||[];if(saved.selectionModel!=='presence'){if(c.locked&&c.adoption==='adopt'&&c.rows.some(r=>!r.included)){c.locked=false;c.version++;c.stage='define'}for(const r of c.rows)delete r.included}}}state.lang=saved.lang==='en'?'en':'zh';state.legacyColorRecord=saved.legacyColorRecord||null;state.legacyRoleSelectionRecord=saved.selectionModel==='presence'?(saved.legacyRoleSelectionRecord||null):originalSaved}else loadIssue=true}else if(input.legacyStorageKey){const old=JSON.parse(localStorage.getItem(input.legacyStorageKey));if(old?.schema==='governui.framework-prototype/1'&&Array.isArray(old.rows)&&old.project===input.project)importLegacy(state,old)}}catch{storageOK=false;loadIssue=true}
// Backfill existing drafts once; preserve intentional removals and confirmed snapshots.
if(!state.defaultsVersion){for(const c of state.categories){if(c.locked)continue;for(const row of c.rows){if(row.binding)continue;const src=(input.generatedStyles||[]).find(s=>s.roleName===row.name);if(src)row.binding={values:clone(src.values),owner:src.owner,ownerStatus:'proposed',sourceId:src.id,sourceName:src.name,sourceEvidence:clone(src.evidence),displayValues:clone(src.displayValues),iconGeometry:src.iconGeometry||null};}}state.defaultsVersion=1;}
// Retain legacy role drafts as history, never present fake glyphs as real assets.
const iconCategory=state.categories.find(c=>c.id==='icons');
if(iconCategory.directoryVersion!==1){
 if(iconCategory.rows.length)iconCategory.history.push({...clone(iconCategory),migration:'legacy-icon-roles'});
 if(state.confirmation){state.confirmationHistory.push(clone(state.confirmation));state.confirmation=null;state.requiresMappingReview=true}
 iconCategory.rows=(input.iconCatalog||[]).map(i=>({id:i.id,name:i.name,meaning:['',''],asset:clone(i),binding:{values:{source:i.source,size:i.sizes.join(', '),stroke:i.stroke},sourceEvidence:clone(i.evidence)},custom:false}));
 iconCategory.directoryVersion=1;iconCategory.locked=false;iconCategory.version++;
}
// Enrich unresolved evidence without overwriting edits or reintroducing deleted rows.
for(const row of iconCategory.rows){const fresh=(input.iconCatalog||[]).find(i=>i.id===row.asset?.id&&i.source===row.asset?.source);if(!fresh)continue;
 if(!row.asset.preview&&fresh.preview)row.asset.preview=fresh.preview;
 row.asset.evidence=clone(fresh.evidence);
 if(!row.binding.values.size&&fresh.sizes.length){row.binding.values.size=fresh.sizes.join(', ');if(iconCategory.locked){iconCategory.locked=false;iconCategory.version++}if(state.confirmation){state.confirmationHistory.push(clone(state.confirmation));state.confirmation=null}state.requiresMappingReview=true;}
}
let atom='color',restoreFocus;
if(new URL(location.href).searchParams.get('step')==='binding'&&!['unused','defer'].includes(state.categories.find(c=>c.id===atom).adoption))state.categories.find(c=>c.id===atom).stage='bind';
const tr=x=>Array.isArray(x)?x[state.lang==='zh'?0:1]:x,t=k=>tr(labels[k]||[k,k]);
const def=()=>catalog.categories.find(c=>c.id===atom),cat=()=>state.categories.find(c=>c.id===atom);
const button=(action,label,attrs='')=>`<button type="button" data-action="${action}" ${attrs}>${label}</button>`;
function persist(){if(loadIssue)return;try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch{storageOK=false}}
function observation(id){return input.observations?.[id]||{status:'unverified',count:0,samples:[]}}
function obsLabel(o){return t(o.status==='detected'?'observed':o.status==='not-detected-in-scope'?'missing':'unverified')}
function complete(c){const d=catalog.categories.find(x=>x.id===c.id);if(c.id==='icons')return c.rows.every(r=>r.name.trim()&&r.asset?.preview&&iconSizes(r.binding?.values?.size));return c.rows.every(r=>/^--[a-z][a-z0-9-]*$/.test(r.name)&&tr(r.meaning)?.trim()&&r.binding&&d.fields.every(f=>validValue(f,r.binding.values[f.id],c.id)))}
function touchCategory(c){if(c.locked){c.version++;c.locked=false}if(state.confirmation){state.confirmationHistory=state.confirmationHistory||[];state.confirmationHistory.push(clone(state.confirmation));state.confirmation=null}state.frameworkRevision=(state.frameworkRevision||0)+1;state.requiresMappingReview=true}
function confirmFramework(){const invalid=state.categories.find(c=>!complete(c));if(invalid){atom=invalid.id;render();document.querySelector('#gate').textContent=tr(['请补齐本类 Token 的名称、语义与属性。','Complete names, meanings and properties in this category.']);return}
 const names=state.categories.filter(c=>c.id!=='icons').flatMap(c=>c.rows.map(r=>r.name));if(new Set(names).size!==names.length){document.querySelector('#gate').textContent=tr(['Token 名称不能重复。','Token names must be unique.']);return}
 const confirmedAt=new Date().toISOString();for(const c of state.categories){const adoption=c.rows.length?'adopt':'unused';if(c.locked&&c.adoption!==adoption){c.locked=false;c.version++}if(!c.locked){c.adoption=adoption;c.locked=true;c.history.push({...snapshot(c),confirmedAt})}}
 state.confirmation={revision:state.frameworkRevision||1,confirmedAt,categoryVersions:state.categories.map(c=>({id:c.id,version:c.version})),authorization:'framework-only-no-code-writes'};persist();render()}
function snapshot(c){const {history,...record}=c;return clone(record)}
function render(){document.documentElement.lang=state.lang==='zh'?'zh-CN':'en';document.querySelector('#lang').textContent=state.lang==='zh'?'EN':'中文';document.querySelector('#export').textContent=t('export');document.querySelector('#manual').textContent=t('manual');document.querySelectorAll('[data-i]').forEach(n=>{const texts={recon:['1 项目摸底','1 Reconnaissance'],framework:['2 定义框架','2 Framework'],batches:['3 分批治理','3 Batches'],verify:['4 验证交付','4 Verification']};n.textContent=tr(texts[n.dataset.i])});

 document.querySelector('#icon-upload').onchange=async e=>{const file=e.target.files[0];if(!file)return;if(!['image/svg+xml','image/png','image/webp'].includes(file.type)||file.size>1024*1024){document.querySelector('#error').textContent=tr(['请选择 1MB 以下的 SVG、PNG 或 WebP。','Select SVG, PNG or WebP under 1MB.']);return}const preview=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});asset={id:crypto.randomUUID(),name:file.name.replace(/\.[^.]+$/,''),source:'user-upload:'+file.name,preview,sizes:[],stroke:'',evidence:[]};document.querySelector('#icon-preview').innerHTML=iconImage(asset);document.querySelector('#icon-name').value=asset.name;document.querySelector('#icon-asset').value=''};
 document.querySelector('#icon-asset').onchange=e=>{asset=e.target.value===''?null:clone(input.iconCatalog[Number(e.target.value)]);document.querySelector('#icon-preview').innerHTML=iconImage(asset);if(asset){document.querySelector('#icon-name').value=asset.name;document.querySelector('#icon-sizes').value=asset.sizes.join(', ');document.querySelector('#icon-stroke').value=asset.stroke||''}};
 document.querySelector('#icon-form').onsubmit=e=>{e.preventDefault();const name=document.querySelector('#icon-name').value.trim(),size=document.querySelector('#icon-sizes').value.trim(),stroke=document.querySelector('#icon-stroke').value.trim(),meaning=document.querySelector('#icon-meaning').value.trim();
 if(!asset||!name||!iconSizes(size)||(stroke&&!/^\d+(\.\d+)?$/.test(stroke))||c.rows.some(x=>x!==r&&x.asset?.id===asset.id)){document.querySelector('#error').textContent=tr(['请选择未重复的图标，填写名称与有效尺寸。','Choose a unique icon and enter its name and valid sizes.']);return}
 const next={...(r||{id:crypto.randomUUID(),custom:true}),name,meaning:[meaning,meaning],asset,binding:{...(r?.binding||{}),values:{source:asset.source,size,stroke},sourceEvidence:clone(asset.evidence),ownerStatus:'proposed'}};
 if(r&&JSON.stringify({...r,binding:{...r.binding,ownerStatus:'proposed'}})===JSON.stringify(next)){close();return}
 touchCategory(c);if(r)Object.assign(r,next);else c.rows.push(next);persist();close();render();
 };
}

function download(value,filename,mime='application/json'){const blob=new Blob([typeof value==='string'?value:JSON.stringify(value,null,2)],{type:mime});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportRecord(){return {...clone(state),catalog:clone(catalog),observations:clone(input.observations||{}),bindingEvidenceBaseline:clone(input.bindingEvidenceBaseline||null),exportedAt:new Date().toISOString(),authorization:'framework-only-no-code-writes'}}
function manual(){const lines=[`# ${input.project} — ${tr(['设计原子框架','Atomic design framework'])}`,'',`${input.scope} · ${input.baseline}`,'',tr(['定义草稿及用户选择；来源采用和页面运行效果需另行验证。','Definitions and user decisions; source adoption and runtime appearance require separate verification.'])];for(const d of catalog.categories){const c=state.categories.find(x=>x.id===d.id);lines.push('',`## ${tr(d.label)}`,'',`${t(c.adoption)} · v${c.version} · ${t(c.locked?'locked':'draft')}`,c.reason,``,tr(c.rule),`${tr(['定义字段','Definition fields'])}: ${d.fields.map(f=>tr(f.label)).join(' · ')}`,``,`${t('evidence')}: ${obsLabel(observation(c.id))}`);for(const r of c.rows){lines.push('',`### ${tr(r.label)} — ${r.name}`,'',tr(r.meaning),`${tr(['适用位置','Intended location'])}: ${tr(r.location)}`,`${tr(['范围','Scope'])}: ${tr(r.scope)}`);if(r.binding){for(const f of d.fields)lines.push(`${tr(f.label)}: ${r.binding.values[f.id]}`);lines.push(`${tr(['来源','Owner'])}: ${r.binding.owner} (${r.binding.ownerStatus})`)}else lines.push(t('pending'))}}return lines.join('\n')+'\n'}
function diff(c){const previous=c.history.at(-1);if(!previous)return [];const before=clone(previous),after=snapshot(c);for(const obj of [before,after])for(const key of ['version','locked','stage','confirmedAt'])delete obj[key];return Object.keys(after).filter(k=>JSON.stringify(after[k])!==JSON.stringify(before[k])).map(k=>({field:k,before:before[k],after:after[k]}))}
document.addEventListener('click',ev=>{const n=ev.target.closest('button[data-atom],button[data-action]');if(!n)return;if(n.dataset.atom){atom=n.dataset.atom;render();return}const action=n.dataset.action,id=n.dataset.id;if(action==='cancel'){close();return}if(action==='legacy'){modal(tr(['旧版颜色完整记录','Complete legacy color record']),`<p>${tr(['原记录完整保留，不自动扩展其确认范围。','Original records are retained without extending their confirmed scope.'])}</p><pre>${esc(JSON.stringify(state.legacyColorRecord,null,2))}</pre>`);return}const c=cat();if(!c)return;if(action==='edit'||action==='add'){editBinding(id);return}if(action==='binding'){editBinding(id);return}if(action==='history'){modal(t('history'),c.history.map(v=>`<div class="changed">v${v.version} · ${t(v.adoption)} · ${esc(v.confirmedAt)}${button('download-version',tr(['导出此版本','Export this version']),`data-version="${v.version}"`)}</div>`).join(''));return}if(action==='download-version'){download(c.history.find(v=>v.version===Number(n.dataset.version)),`${input.project}-${atom}-v${n.dataset.version}.json`);return}if(action==='diff'){modal(t('diff'),`<pre>${esc(JSON.stringify(diff(c),null,2))}</pre>`);return}if(action==='define'||action==='bind'){if(action==='bind'&&['unused','defer'].includes(c.adoption))return;c.stage=action;persist();render();return}if(action==='confirm-framework'){confirmFramework();return}if(action==='revision'&&c.locked){c.locked=false;c.version++;c.stage='define';persist();render();return}if(c.locked&&!['remove-role','undo-remove'].includes(action))return;
 if(action==='remove-role'){const index=c.rows.findIndex(r=>r.id===id);if(index<0)return;touchCategory(c);const [row]=c.rows.splice(index,1);c.removedRows.push({row:clone(row),index,removedAt:new Date().toISOString()});persist();render();return}
 if(action==='undo-remove'){const removed=c.removedRows.at(-1);if(!removed)return;if(state.categories.some(category=>category.rows.some(r=>r.name===removed.row.name))){modal(t('undo'),`<p>${tr(['同名 Token 已存在，请先修改其名称再恢复。','A token with this name already exists. Rename it before restoring.'])}</p>${button('cancel',t('cancel'))}`);return}touchCategory(c);c.removedRows.pop();c.rows.splice(Math.min(removed.index,c.rows.length),0,removed.row);persist();render();return}
 if(action==='rule'){modal(tr(['本类使用规则','Category use rule']),`<form id="rule-form">${field(tr(['规则','Rule']),'rule-value',tr(c.rule),'textarea')}${footer()}</form>`);document.querySelector('#rule-form').onsubmit=ev=>{ev.preventDefault();const v=document.querySelector('#rule-value').value.trim();if(!v)return;c.rule=[v,v];persist();close();render()};return}
 if(action==='lock'){if(!complete(c))return;modal(t('confirm'),`<p>${esc(tr(def().label))} · ${t(c.adoption)} · v${c.version}</p><p>${tr(['保存当前列表中的 Token 定义。此确认不修改应用源码。','Save the token definitions currently in this list. This confirmation does not modify application source.'])}</p><div class="dialogfoot">${button('cancel',t('cancel'))}${button('confirm-lock',t('confirm'),'class="primary"')}</div>`);return}
 if(action==='confirm-lock'){if(!complete(c))return;c.locked=true;c.history.push({...snapshot(c),confirmedAt:new Date().toISOString()});persist();close();render()}
});

document.querySelector('#export').onclick=()=>download(exportRecord(),input.project+'-atomic-framework.json');document.querySelector('#manual').onclick=()=>download(manual(),'DESIGN-SYSTEM.md','text/markdown');document.querySelector('#lang').onclick=()=>{state.lang=state.lang==='zh'?'en':'zh';persist();render()};persist();render();

</script></body></html>
