<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>UITokenForge · 元素级摸底</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202120;background:#fff;font-size:14px;line-height:1.55;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;border:1px solid #d8dad7;border-radius:7px;padding:8px 13px;background:white;color:inherit}button:hover{background:#eeeeeb}button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid #345baf;outline-offset:3px}a{color:#284d9c}h1{font-size:24px;letter-spacing:-.5px;margin:0}h2{font-size:18px;margin:0}h3{font-size:14px;margin:0 0 10px}p{margin:6px 0}header{display:flex;align-items:center;gap:28px;padding:18px 28px;border-bottom:1px solid #e6e7e4}.brand{font-size:18px;font-weight:700}.steps{display:flex;gap:26px;color:#71736f}.steps b{color:#202120;font-weight:600}.tools{margin-left:auto;display:flex;gap:8px}.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{padding:26px 16px;background:#f6f6f3;border-right:1px solid #e6e7e4}nav button{display:block;width:100%;text-align:left;border:0;background:none;margin:4px 0;min-height:40px}nav button[aria-current=true]{background:#e7e8e3;font-weight:600}.muted{color:#666b65}.eyebrow{color:#666b65;margin-bottom:14px}.content{padding:30px 36px;min-width:0}.title-row{display:flex;justify-content:space-between;align-items:start;gap:20px}.scope{margin-top:8px;color:#666b65}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:30px 0}.stat strong{display:block;font-size:24px;line-height:1.3;font-variant-numeric:tabular-nums}.stat span{color:#666b65}.tabs{display:flex;gap:18px;border-bottom:1px solid #dedfdb;margin-bottom:18px}.tabs button{border:0;border-radius:0;padding:10px 0;background:transparent;color:#666b65}.tabs button[aria-selected=true]{color:#171817;border-bottom:2px solid #171817;font-weight:600}.filters{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}.filters input{padding:9px 12px;border:1px solid #d8dad7;border-radius:7px;width:260px;max-width:100%;background:white}.filters select{padding:8px;border:1px solid #d8dad7;border-radius:7px;max-width:100%;background:white}.count{margin-left:auto;color:#666b65}.table-wrap{max-width:100%;overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed;min-width:820px;text-align:left}th{font-size:14px;font-weight:500;color:#666b65;padding:12px 14px;background:#f6f6f3}td{padding:17px 14px;vertical-align:top;border-bottom:1px solid #e6e7e4;overflow-wrap:anywhere}th:nth-child(1){width:21%}th:nth-child(2){width:31%}th:nth-child(3){width:17%}th:nth-child(4){width:23%}th:nth-child(5){width:8%}.element{font-weight:600;display:block}.small{display:block;color:#666b65;margin-top:4px}.pill{display:inline-block;background:#f0f1ed;color:#535a51;padding:2px 8px;border-radius:5px;font-size:13px;margin:5px 4px 0 0}.warn{background:#fff1d9;color:#82540c}.link-button{border:0;padding:3px 0;background:transparent;color:#284d9c}.evidence-note{padding:12px 0;margin-top:16px;color:#666b65}details{margin-top:16px}summary{cursor:pointer;color:#535a51}code{font-size:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f6f3;padding:14px;border-radius:6px;font-size:12px}dialog{border:0;border-radius:12px;padding:0;width:min(820px,calc(100vw - 32px));max-height:90vh;box-shadow:0 20px 70px #0003;color:inherit}dialog::backdrop{background:#0005}.dialog-head{display:flex;align-items:center;gap:20px;padding:22px 26px;border-bottom:1px solid #e5e6e2;position:sticky;top:0;background:white;z-index:1}.dialog-head button{margin-left:auto}.dialog-body{padding:22px 26px}.detail-block{margin-bottom:26px}.detail-block ol{padding-left:22px}.fact{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid #eeefeb}.fact-list{display:flex;flex-wrap:wrap;gap:6px}.fact-value{display:block;background:#f4f4f1;padding:4px 7px;border-radius:4px}.fact-value small{display:block;font-family:system-ui;font-size:12px;color:#666b65}.inactive{opacity:.7}.empty{padding:30px;text-align:center;color:#666b65}.footer{margin-top:24px;color:#666b65;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);left:0;top:0}
aside{min-width:0}
@media(max-width:1050px){.content{padding:24px}.layout{grid-template-columns:190px minmax(0,1fr)}.steps{gap:16px}.steps span{display:none}}
@media(max-width:650px){header{padding:14px 16px;gap:12px}.steps{display:none}.tools button{padding:7px 9px}.layout{grid-template-columns:1fr}aside{padding:14px 16px;border-right:0;border-bottom:1px solid #e6e7e4}aside .eyebrow{display:none}nav{display:flex;overflow-x:auto;gap:8px}nav button{width:auto;white-space:nowrap;padding:7px 10px!important;margin:0}.content{padding:22px 16px}.stats{gap:16px 8px;grid-template-columns:repeat(2,minmax(0,1fr));margin:22px 0}.title-row{flex-wrap:wrap}.dialog-head,.dialog-body{padding:18px}.fact{grid-template-columns:90px minmax(0,1fr)}.count{margin-left:0}}
</style></head><body>
<header><div class="brand">UITokenForge</div><div class="steps"><b data-zh="1 项目摸底" data-en="1 Reconnaissance"></b><span data-zh="2 定义框架" data-en="2 Framework"></span><span data-zh="3 分批治理" data-en="3 Batches"></span><span data-zh="4 验证交付" data-en="4 Verification"></span></div><div class="tools"><button id="lang" aria-label="Switch language">EN</button><button id="export" data-zh="导出记录" data-en="Export records"></button></div></header>
<div class="layout"><aside><div class="eyebrow" data-zh="功能目录" data-en="Product functions"></div><nav id="tree" aria-label="Product functions"></nav></aside><main class="content">
<div class="title-row"><div><h1 id="heading"></h1><div class="scope" id="scope"></div></div><span class="pill" data-zh="首轮摸底 · 只读" data-en="First pass · Read-only"></span></div>
<div class="stats" id="stats"></div><div class="tabs" role="tablist"><button id="issues-tab" role="tab" aria-selected="true" data-zh="问题清单" data-en="Issues"></button><button id="elements-tab" role="tab" aria-selected="false" data-zh="全部 UI 元素" data-en="All UI elements"></button></div>
<div class="filters"><label><span class="sr-only" data-zh="搜索元素或问题" data-en="Search elements or issues"></span><input id="search" type="search"></label><label><span class="sr-only" data-zh="样式类型" data-en="Style category"></span><select id="category"></select></label><span class="count" id="count"></span></div>
<div class="table-wrap"><table><thead><tr><th data-zh="UI 元素" data-en="UI element"></th><th id="facts-heading"></th><th data-zh="出现条件" data-en="Conditions"></th><th data-zh="位置 / 打开路径" data-en="Location / opening path"></th><th><span class="sr-only" data-zh="查看" data-en="View"></span></th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="evidence-note" data-zh="已定位源码；页面状态尚未验证。没有修改业务代码。" data-en="Source located; page states are unverified. Application code is unchanged."></div><details><summary data-zh="范围与未覆盖项" data-en="Scope and coverage gaps"></summary><div id="coverage"></div></details><div class="footer" id="baseline"></div>
</main></div><dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" data-zh="关闭" data-en="Close"></button></div><div class="dialog-body" id="detail-body"></div></dialog>
<script type="application/json" id="recon-data">__RECON_DATA__</script>
<script>
const data=JSON.parse(document.querySelector('#recon-data').textContent),$=s=>document.querySelector(s);
let lang='zh',nodeId=data.nodes[0].id,view='issues',query='',category='all';
const t=(zh,en)=>lang==='zh'?zh:en, label=v=>Array.isArray(v)?v[lang==='zh'?0:1]:v??'',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const descendant=(id,parent)=>{let n=data.nodes.find(n=>n.id===id);while(n){if(n.id===parent)return true;n=data.nodes.find(p=>p.id===n.parentId)}return false};
const pathFor=id=>{const path=[];let n=data.nodes.find(n=>n.id===id);while(n){path.unshift(label(n.title));n=data.nodes.find(p=>p.id===n.parentId)}return path.join(' / ')};
const status=i=>i.status==='needs-user-decision'?t('语义需确认','Semantic review'):i.status==='blocked-runtime'?t('待页面核验','Runtime check'):t('待框架对照','Compare framework');
function factHtml(f){return '<code class="fact-value">'+esc(f.value)+'<small>'+esc([...f.variants,...f.conditions.map(c=>c.expression)].join(' · '))+'</small></code>'}
function render(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';document.querySelectorAll('[data-zh]').forEach(e=>e.textContent=e.dataset[lang]);$('#lang').textContent=lang==='zh'?'EN':'中文';
  $('#search').placeholder=t('搜索元素或问题','Search elements or issues');
  $('#tree').innerHTML=data.nodes.map(n=>{let depth=0,p=n;while(p.parentId){depth++;p=data.nodes.find(q=>q.id===p.parentId)}return '<button data-node="'+esc(n.id)+'" style="padding-left:'+(10+depth*14)+'px" aria-current="'+(nodeId===n.id)+'">'+esc(label(n.title))+'</button>'}).join('');
  $('#heading').textContent=label(data.nodes.find(n=>n.id===nodeId).title);$('#scope').textContent=data.project+' / '+pathFor(nodeId);
  const elements=data.elements.filter(e=>descendant(e.nodeId,nodeId)),elementIds=new Set(elements.map(e=>e.id));
  const issues=data.issues.filter(i=>i.occurrences.some(o=>elementIds.has(o.elementId)));
  $('#stats').innerHTML=[[elements.length,t('UI 元素','UI elements')],[issues.length,t('问题 / 核验点','Issues / checks')],[issues.filter(i=>i.status==='needs-user-decision').length,t('需要你确认','Your decisions')],[0,t('页面已验证','Runtime verified')]].map(([n,s])=>'<div class="stat"><strong>'+n+'</strong><span>'+s+'</span></div>').join('');
  $('#issues-tab').setAttribute('aria-selected',view==='issues');$('#elements-tab').setAttribute('aria-selected',view==='elements');
  $('#category').innerHTML='<option value="all">'+t('全部样式类型','All style categories')+'</option>'+Object.entries(data.categoryLabels).map(([id,l])=>'<option value="'+id+'">'+esc(label(l))+'</option>').join('');$('#category').value=category;
  const entries=view==='issues'?issues.map(i=>({issue:i,element:data.elements.find(e=>e.id===i.occurrences.find(o=>elementIds.has(o.elementId)).elementId)})):elements.map(e=>({element:e}));
  const filtered=entries.filter(({element:e,issue:i})=>(category==='all'||(i?i.category===category:e.facts.some(f=>f.active&&f.category===category)))&&JSON.stringify([e,i]).toLowerCase().includes(query.toLowerCase()));
  $('#facts-heading').textContent=view==='issues'?t('具体问题 / 核验点','Issue / verification point'):t('当前样式','Observed styles');$('#count').textContent=filtered.length+t(' 条',' records');
  $('#rows').innerHTML=filtered.map(({element:e,issue:i})=>{const facts=e.facts.filter(f=>f.active&&f.category!=='other');return '<tr><td><span class="element">'+esc(label(e.title))+'</span><span class="small">'+esc(label(data.nodes.find(n=>n.id===e.nodeId).title))+'</span>'+(e.sharedOwner?'<span class="pill">'+t('共享组件内部元素','Shared component element')+'</span>':'')+'</td><td>'+(i?esc(label(i.title))+'<span class="small">'+esc(label(i.next))+'</span><span class="pill '+(i.status==='needs-user-decision'?'warn':'')+'">'+status(i)+'</span>':esc(uniqueCategories(facts).join(' · '))+'<span class="small">'+facts.length+t(' 项样式记录',' style records')+(e.inheritsFrom?' · '+t('继承父级样式','Inherits parent styles'):'')+'</span>')+'</td><td>'+esc(label(e.contextLabel))+'</td><td>'+esc(label(e.opening.location))+'<span class="small">'+t('路径由源码推导','Source-inferred path')+'</span></td><td><button class="link-button" data-detail="'+esc(e.id)+'">'+t('查看','View')+'</button></td></tr>'}).join('')||'<tr><td colspan="5" class="empty">'+t('此筛选下没有记录','No records match these filters')+'</td></tr>';
  $('#baseline').textContent=t('源码基线 ','Source baseline ')+(data.baseline.commit?.slice(0,12)||'not-git')+' · '+data.coverage.sourceFiles+t(' 个证据文件',' evidence files');
  $('#coverage').innerHTML='<p>'+t('本次只覆盖已标注的功能链路，不代表全项目扫描完成。','Only the annotated functional chain is covered; this is not a full-project audit.')+'</p><p>'+t('当前入口不启用的样式记录：','Style records inactive at the selected entry: ')+data.summary.inactiveStyleFacts+'</p><p>'+t('尚未求值的表达式：','Unevaluated expressions: ')+data.summary.unresolvedExpressions+'</p>'+data.exclusions.map(e=>'<p>'+esc(label(e.title))+' — '+esc(label(e.reason))+'</p>').join('');
}
function uniqueCategories(facts){return [...new Set(facts.map(f=>label(data.categoryLabels[f.category])))]}
function showDetail(id){const e=data.elements.find(e=>e.id===id),issues=data.issues.filter(i=>e.issueIds.includes(i.id));$('#detail-title').textContent=label(e.title);
  const groups=Object.entries(data.categoryLabels).map(([id,l])=>{const facts=e.facts.filter(f=>f.active&&f.category===id);return facts.length?'<div class="fact"><span>'+esc(label(l))+'</span><div class="fact-list">'+facts.map(factHtml).join('')+'</div></div>':''}).join('');
  const parent=data.elements.find(p=>p.id===e.inheritsFrom);
  $('#detail-body').innerHTML='<div class="detail-block"><h3>'+t('位置与打开步骤','Location and opening steps')+'</h3><p>'+esc(pathFor(e.nodeId))+'</p><p>'+esc(label(e.opening.preconditions))+'</p><ol>'+e.opening.steps.map(s=>'<li>'+esc(label(s))+'</li>').join('')+'</ol><span class="pill">'+t('源码推导 · 尚未实测','Source-inferred · Not replayed')+'</span></div>'+
  '<div class="detail-block"><h3>'+t('具体问题','Issues')+'</h3>'+(issues.map(i=>'<p><strong>'+esc(label(i.title))+'</strong><span class="pill">'+status(i)+'</span></p><p class="muted">'+esc(label(i.next))+'</p>').join('')||t('没有命中本轮检查规则；不等于通过全部检查。','No rule matched; this is not an all-checks-passed claim.'))+'</div>'+
  '<div class="detail-block"><h3>'+t('当前样式 · 源码记录，不是页面截图','Observed styles · source facts, not a screenshot')+'</h3>'+groups+(parent?'<p>'+t('文字继承自：','Text inherits from: ')+'<button class="link-button" data-detail="'+esc(parent.id)+'">'+esc(label(parent.title))+'</button></p>':'')+'</div>'+
  '<details><summary>'+t('当前入口未启用的分支','Inactive branches at this entry')+'</summary>'+e.facts.filter(f=>!f.active).map(factHtml).join('')+(e.bindings?'<pre>'+esc(JSON.stringify(e.bindings,null,2))+'</pre>':'')+'</details>'+
  '<details><summary>'+t('代码位置、状态与未解析项','Source locations, states and unresolved expressions')+'</summary>'+e.sources.map(s=>'<p><code>'+esc(s.file+':'+s.line)+'</code></p>').join('')+'<pre>'+esc(JSON.stringify({openingEvidence:e.opening.evidence,states:e.states,unresolved:e.unresolved,definitionCandidates:e.facts.flatMap(f=>f.definitionCandidates)},null,2))+'</pre></details>';
  if(!$('#detail').open)$('#detail').showModal();
}
document.addEventListener('click',event=>{const n=event.target.closest('[data-node]'),d=event.target.closest('[data-detail]');if(n){nodeId=n.dataset.node;render()}if(d)showDetail(d.dataset.detail)});
$('#issues-tab').onclick=()=>{view='issues';render()};$('#elements-tab').onclick=()=>{view='elements';render()};$('#category').onchange=e=>{category=e.target.value;render()};$('#search').oninput=e=>{query=e.target.value;render()};$('#close').onclick=()=>$('#detail').close();$('#lang').onclick=()=>{lang=lang==='zh'?'en':'zh';$('#detail').close();render()};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='element-recon.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
